    <path d="M36 40 L36 12 A24 24 0 0 1 52 20 Z" fill="#ffffff" fill-opacity="0.08"/>
    <path d="M36 40 L52 20 A24 24 0 0 1 56 40 L36 40 Z" fill="#ffffff" fill-opacity="0.08"/>
