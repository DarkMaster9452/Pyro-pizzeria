<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Polomárik Pizzeria">
  <defs>
    <path id="polomarik-top" d="M 26,100 A 74,74 0 0 1 174,100" />
  </defs>
  <!-- badge -->
  <circle cx="100" cy="100" r="96" fill="#2b2d31" stroke="#F5B301" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#F5B301" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- curved name -->
  <text font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="22" letter-spacing="2" fill="#F5B301">
    <textPath href="#polomarik-top" startOffset="50%" text-anchor="middle">POLOMÁRIK</textPath>
  </text>
  <!-- wheat sprig -->
  <g stroke="#F5B301" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M100 60 L100 78"/>
    <path d="M100 64 L92 60 M100 64 L108 60"/>
    <path d="M100 70 L92 66 M100 70 L108 66"/>
    <path d="M100 76 L93 72 M100 76 L107 72"/>
  </g>
  <line x1="60" y1="84" x2="140" y2="84" stroke="#F5B301" stroke-width="1.5"/>
  <!-- PIZZERIA -->
  <text x="100" y="112" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="24" letter-spacing="2" fill="#ffffff" text-anchor="middle">PIZZERIA</text>
  <!-- stars -->
  <g fill="#F5B301">
    <path d="M62 124 l1.6 3.4 3.7 .5 -2.7 2.6 .7 3.7 -3.3 -1.8 -3.3 1.8 .7 -3.7 -2.7 -2.6 3.7 -.5 z"/>
    <path d="M138 124 l1.6 3.4 3.7 .5 -2.7 2.6 .7 3.7 -3.3 -1.8 -3.3 1.8 .7 -3.7 -2.7 -2.6 3.7 -.5 z"/>
  </g>
  <!-- half-pizza illustration -->
  <g>
    <path d="M40 150 A60 60 0 0 1 160 150 Z" fill="#ffffff" fill-opacity="0.9"/>
    <g stroke="#2b2d31" stroke-width="1.6" stroke-linecap="round">
      <path d="M70 150 L88 128"/>
      <path d="M100 150 L100 122"/>
      <path d="M130 150 L112 128"/>
    </g>
    <g fill="#2b2d31">
      <circle cx="78" cy="140" r="3"/>
      <circle cx="100" cy="136" r="3"/>
      <circle cx="122" cy="140" r="3"/>
      <circle cx="90" cy="146" r="2"/>
      <circle cx="110" cy="146" r="2"/>
    </g>
  </g>
</svg>
